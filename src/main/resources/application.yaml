spring:
  application:
    name: archive-adapter-simulator

  output:
      ansi:
          enabled: always

server:
  port: 8080

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

wiremock:
  port: 9090

simulator:
  base-url: http://fint-arkiv-adapter-simulator:9090
  post-case-timeout: 130s
  timeout-buffer: 5s
